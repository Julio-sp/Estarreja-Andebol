<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Puzzle EAC</title>
<style>
  :root{
    --verde: #1f7a3d;
    --verde-escuro: #0f4a24;
    --verde-claro: #2fa356;
    --creme: #f4f1ea;
    --texto: #1a1a1a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(160deg, var(--verde-escuro), var(--verde) 55%, var(--verde-claro));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--texto);
    overflow-x:hidden;
  }
  .app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 14px 34px;
  }
  h1{
    color:#fff;
    font-size: 1.3rem;
    margin: 4px 0 2px;
    text-align:center;
    letter-spacing:.5px;
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  h1 img{
    width: 34px;
    height: 34px;
    object-fit: contain;
    vertical-align: middle;
  }
  .subtitle{
    color: rgba(255,255,255,.85);
    font-size:.8rem;
    margin-bottom:14px;
    text-align:center;
  }
  .card{
    background: var(--creme);
    border-radius: 20px;
    padding: 14px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 14px 32px rgba(0,0,0,.35);
  }
  .controls-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .seg{
    flex:1;
    display:flex;
    background:#e4e0d4;
    border-radius: 12px;
    padding: 3px;
    gap:3px;
  }
  .seg button{
    flex:1;
    border:none;
    background:transparent;
    padding: 9px 4px;
    border-radius: 9px;
    font-size:.78rem;
    font-weight:600;
    color:#555;
    cursor:pointer;
  }
  .seg button.active{
    background: var(--verde);
    color:#fff;
    box-shadow: 0 3px 8px rgba(31,122,61,.4);
  }
  .ref-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:#e4e0d4;
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .ref-box img{
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    flex-shrink:0;
  }
  .ref-box span{
    font-size:.72rem;
    color:#555;
    line-height:1.25;
  }
  .scoreboard{
    display:flex;
    gap:8px;
    margin: 10px 0;
  }
  .stat{
    flex:1;
    background: var(--verde-escuro);
    color:#fff;
    border-radius: 12px;
    padding: 8px 6px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .stat .label{
    font-size:.62rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.75;
    margin-bottom:2px;
  }
  .stat .value{
    font-size:1.15rem;
    font-weight:700;
    font-family: 'Courier New', monospace;
  }
  .board-wrap{
    position:relative;
    width:100%;
    /* aspect-ratio as a modern fallback; JS also forces height=width for old webviews */
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow:hidden;
    background: #0f4a24;
    box-shadow: inset 0 0 0 3px var(--verde), 0 6px 18px rgba(0,0,0,.25);
    -ms-touch-action: manipulation;
    touch-action: manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  .board{
    position:absolute;
    inset:0;
    display:grid;
  }
  .tile{
    position:relative;
    background-size: cover;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
    cursor:pointer;
    transition: transform .16s ease;
    overflow:hidden;
  }
  .tile.empty{
    visibility:hidden;
  }
  .tile .num{ display:none; }
  .buttons-row{
    display:flex;
    gap:8px;
    margin-top: 14px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius: 12px;
    padding: 12px 8px;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background: var(--verde);
    box-shadow: 0 4px 10px rgba(31,122,61,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn.secondary{
    background:#555;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .btn:active{ transform: scale(.96); }
  .win-overlay{
    position:fixed;
    inset:0;
    background: rgba(15,74,36,.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .win-overlay.show{ display:flex; }
  .win-card{
    background:#fff;
    border-radius: 20px;
    padding: 28px 22px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    animation: pop .35s ease;
  }
  @keyframes pop{
    0%{ transform: scale(.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .win-card h2{
    color: var(--verde-escuro);
    margin: 4px 0 6px;
    font-size:1.3rem;
  }
  .win-card p{
    margin: 4px 0 18px;
    color:#444;
    font-size:.9rem;
  }
  .win-emoji{ font-size: 2.6rem; }
  footer{
    margin-top: 16px;
    color: rgba(255,255,255,.6);
    font-size:.68rem;
    text-align:center;
  }
</style>
</head>

let state = {
  size: 3,
  image: 'mascote',
  tiles: [],       // tiles[position] = tile number (0 = empty), length size*size
  moves: 0,
  seconds: 0,
  timerId: null,
  started: false,
  won: false
};

const boardEl = document.getElementById('board');
const timeVal = document.getElementById('timeVal');
const movesVal = document.getElementById('movesVal');
const winOverlay = document.getElementById('winOverlay');
const winText = document.getElementById('winText');

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+":"+sec;
}

function startTimer(){
  stopTimer();
  state.seconds = 0;
  timeVal.textContent = formatTime(0);
  state.timerId = setInterval(()=>{
    state.seconds++;
    timeVal.textContent = formatTime(state.seconds);
  },1000);
}
function stopTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

function solvedArray(n){
  const arr = [];
  for(let i=1;i<n*n;i++) arr.push(i);
  arr.push(0);
  return arr;
}

// Build a solved board, then perform many random valid slide-moves
// from the empty tile so the puzzle is always solvable.
function shuffleFromSolved(n, movesCount){
  const arr = solvedArray(n);
  let emptyIdx = arr.length - 1;
  let lastMove = -1;
  for(let i=0;i<movesCount;i++){
    const r = Math.floor(emptyIdx / n);
    const c = emptyIdx % n;
    const neighbors = [];
    if(r>0) neighbors.push(emptyIdx - n);
    if(r<n-1) neighbors.push(emptyIdx + n);
    if(c>0) neighbors.push(emptyIdx - 1);
    if(c<n-1) neighbors.push(emptyIdx + 1);
    // avoid immediately undoing the previous move when possible
    let options = neighbors.filter(x => x !== lastMove);
    if(options.length === 0) options = neighbors;
    const pick = options[Math.floor(Math.random()*options.length)];
    arr[emptyIdx] = arr[pick];
    arr[pick] = 0;
    lastMove = emptyIdx;
    emptyIdx = pick;
  }
  return arr;
}

const boardWrap = document.querySelector('.board-wrap');
const refImg = document.getElementById('refImg');

// Force the board wrapper to be a perfect square via JS, since some
// older mobile webviews (common inside chat apps) do not support the
// CSS aspect-ratio property, which would otherwise leave the board
// at 0 height, hidden and unclickable.
function fixBoardSize(){
  const w = boardWrap.getBoundingClientRect().width;
  if(w > 0){
    boardWrap.style.height = w + 'px';
  }
}
window.addEventListener('resize', fixBoardSize);
window.addEventListener('orientationchange', fixBoardSize);

function buildBoard(){
  const n = state.size;
  boardEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;
  boardEl.innerHTML = '';

  fixBoardSize();

  for(let pos=0; pos<n*n; pos++){
    const tileEl = document.createElement('div');
    tileEl.className = 'tile';
    tileEl.dataset.pos = pos;
    boardEl.appendChild(tileEl);
  }
  renderTiles();
  // run again after layout settles (fonts/images can shift width on first paint)
  setTimeout(fixBoardSize, 50);
  setTimeout(fixBoardSize, 300);
}

function renderTiles(){
  const n = state.size;
  const cells = boardEl.children;
  const imgUrl = IMAGES[state.image];
  refImg.src = imgUrl;

  for(let pos=0; pos<n*n; pos++){
    const val = state.tiles[pos];
    const cell = cells[pos];
    if(val === 0){
      cell.className = 'tile empty';
      cell.style.backgroundImage = '';
      cell.innerHTML = '';
    } else {
      cell.className = 'tile';
      const r = Math.floor((val-1)/n);
      const c = (val-1)%n;
      const pct = 100/(n-1);
      cell.style.backgroundImage = `url('${imgUrl}')`;
      cell.style.backgroundSize = `${n*100}% ${n*100}%`;
      cell.style.backgroundPosition = `${c*pct}% ${r*pct}%`;
      cell.innerHTML = '';
    }
  }
}

function isSolved(){
  const target = solvedArray(state.size);
  for(let i=0;i<target.length;i++){
    if(state.tiles[i] !== target[i]) return false;
  }
  return true;
}

function tryMove(pos){
  if(state.won) return;
  const n = state.size;
  const emptyIdx = state.tiles.indexOf(0);
  const r1 = Math.floor(pos/n), c1 = pos%n;
  const r2 = Math.floor(emptyIdx/n), c2 = emptyIdx%n;
  const adjacent = (Math.abs(r1-r2)+Math.abs(c1-c2)) === 1;
  if(!adjacent) return;

  if(!state.started){
    state.started = true;
    startTimer();
  }

  state.tiles[emptyIdx] = state.tiles[pos];
  state.tiles[pos] = 0;
  state.moves++;
  movesVal.textContent = state.moves;
  renderTiles();

  if(isSolved()){
    state.won = true;
    stopTimer();
    winText.textContent = `Tempo: ${formatTime(state.seconds)} · Movimentos: ${state.moves}`;
    setTimeout(()=>{ winOverlay.classList.add('show'); }, 250);
  }
}

let lastTouchTime = 0;

function handleTileActivate(e){
  const tile = e.target.closest('.tile');
  if(!tile) return;
  tryMove(parseInt(tile.dataset.pos,10));
}

// Standard click covers most modern browsers.
boardEl.addEventListener('click', (e)=>{
  // avoid double-firing right after a touchend on older webviews
  if(Date.now() - lastTouchTime < 500) return;
  handleTileActivate(e);
});

// Explicit touchend fallback for older/embedded webviews where the
// synthetic click event after a tap is unreliable.
boardEl.addEventListener('touchend', (e)=>{
  lastTouchTime = Date.now();
  const touch = e.changedTouches && e.changedTouches[0];
  if(!touch) return;
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if(!el) return;
  const tile = el.closest('.tile');
  if(!tile) return;
  e.preventDefault();
  tryMove(parseInt(tile.dataset.pos,10));
}, { passive:false });

function newGame(){
  stopTimer();
  state.moves = 0;
  state.seconds = 0;
  state.started = false;
  state.won = false;
  movesVal.textContent = '0';
  timeVal.textContent = '00:00';
  winOverlay.classList.remove('show');

  const n = state.size;
  const shuffleMoves = n === 3 ? 80 : 140;
  state.tiles = shuffleFromSolved(n, shuffleMoves);

  // Guard: never start on an already-solved shuffle
  if(isSolved()){
    state.tiles = shuffleFromSolved(n, shuffleMoves + 20);
  }

  buildBoard();
}

document.getElementById('imgSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#imgSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.image = btn.dataset.img;
  renderTiles();
});

document.getElementById('diffSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#diffSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.size = parseInt(btn.dataset.size,10);
  newGame();
});

document.getElementById('shuffleBtn').addEventListener('click', newGame);
document.getElementById('playAgainBtn').addEventListener('click', newGame);

newGame();
</script>
