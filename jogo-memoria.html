<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo da Memória - EAC</title>
<style>
  :root{
    --verde: #1f7a3d;
    --verde-escuro: #0f4a24;
    --verde-claro: #2fa356;
    --creme: #f4f1ea;
    --texto: #1a1a1a;
    --dourado: #e8b64c;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(160deg, var(--verde-escuro), var(--verde) 55%, var(--verde-claro));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--texto);
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  .app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 16px 12px 30px;
  }
  h1{
    color:#fff;
    font-size: 1.2rem;
    margin: 4px 0 2px;
    text-align:center;
    letter-spacing:.5px;
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  h1 img{
    width: 28px;
    height: 28px;
    object-fit: contain;
  }
  .subtitle{
    color: rgba(255,255,255,.85);
    font-size:.76rem;
    margin-bottom:12px;
    text-align:center;
    max-width: 380px;
  }
  .card-shell{
    background: var(--creme);
    border-radius: 20px;
    padding: 12px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 14px 32px rgba(0,0,0,.35);
    position:relative;
  }
  .scoreboard{
    display:flex;
    gap:8px;
    margin-bottom: 10px;
  }
  .stat{
    flex:1;
    background: var(--verde-escuro);
    color:#fff;
    border-radius: 12px;
    padding: 7px 6px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .stat .label{
    font-size:.58rem;
    text-transform:uppercase;
    letter-spacing:.07em;
    opacity:.75;
    margin-bottom:2px;
  }
  .stat .value{
    font-size:1.02rem;
    font-weight:700;
    font-family: 'Courier New', monospace;
  }

  .board-wrap{
    position:relative;
    width:100%;
  }
  .board{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    width:100%;
  }
  .cell{
    position:relative;
    width:100%;
    padding-top: 100%; /* square via padding trick, safe on old webviews */
  }
  .card{
    position:absolute;
    inset:0;
    border-radius: 10px;
    cursor:pointer;
    background: linear-gradient(150deg, var(--verde), var(--verde-escuro));
    box-shadow: 0 3px 7px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .13s ease, box-shadow .13s ease;
    overflow:hidden;
  }
  .card::before{
    content:'';
    width: 46%;
    height: 46%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.35);
  }
  .card.revealed{
    background: #fff;
    box-shadow: 0 3px 7px rgba(0,0,0,.3), inset 0 0 0 2px var(--dourado);
  }
  .card.revealed::before{ display:none; }
  .card.revealed img{
    width: 82%;
    height: 82%;
    object-fit: contain;
  }
  .card.matched{
    background: #fff;
    box-shadow: 0 0 0 3px var(--dourado);
    opacity: .55;
  }
  .card.matched::before{ display:none; }
  .card.pop{
    animation: pop .28s ease;
  }
  @keyframes pop{
    0%{ transform: scale(1); }
    45%{ transform: scale(.88); }
    100%{ transform: scale(1); }
  }
  .card.wrong{
    animation: shake .3s ease;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-4px); }
    75%{ transform: translateX(4px); }
  }

  .buttons-row{
    display:flex;
    gap:8px;
    margin-top: 14px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius: 12px;
    padding: 12px 8px;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background: var(--verde);
    box-shadow: 0 4px 10px rgba(31,122,61,.4);
  }
  .btn:active{ transform: scale(.96); }

  .win-overlay{
    position:fixed;
    inset:0;
    background: rgba(15,74,36,.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .win-overlay.show{ display:flex; }
  .win-card{
    background:#fff;
    border-radius: 20px;
    padding: 28px 22px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    animation: winPop .35s ease;
  }
  @keyframes winPop{
    0%{ transform: scale(.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .win-card h2{
    color: var(--verde-escuro);
    margin: 4px 0 6px;
    font-size:1.25rem;
  }
  .win-card p{
    margin: 4px 0 18px;
    color:#444;
    font-size:.88rem;
  }
  .win-emoji{ font-size: 2.4rem; }
  footer{
    margin-top: 16px;
    color: rgba(255,255,255,.6);
    font-size:.66rem;
    text-align:center;
  }
</style>
</head>

const SYMBOLS = Object.keys(ICONS); // 10 symbols -> 20 cards

const boardEl = document.getElementById('board');
const timeVal = document.getElementById('timeVal');
const movesVal = document.getElementById('movesVal');
const pairsVal = document.getElementById('pairsVal');
const winOverlay = document.getElementById('winOverlay');
const winText = document.getElementById('winText');

let state = {
  cards: [],       // array of { symbol, matched, revealed, el }
  revealedIdx: [],
  moves: 0,
  seconds: 0,
  timerId: null,
  started: false,
  busy: false,
  pairsFound: 0
};

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+":"+sec;
}
function startTimer(){
  stopTimer();
  state.seconds = 0;
  timeVal.textContent = formatTime(0);
  state.timerId = setInterval(()=>{
    state.seconds++;
    timeVal.textContent = formatTime(state.seconds);
  },1000);
}
function stopTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildDeck(){
  let deck = [];
  SYMBOLS.forEach(sym=>{
    deck.push(sym);
    deck.push(sym);
  });
  return shuffle(deck);
}

function buildBoard(){
  boardEl.innerHTML = '';
  const deck = buildDeck();
  state.cards = deck.map((symbol)=>({ symbol, matched:false, revealed:false, el:null }));

  state.cards.forEach((cardData, idx)=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    cell.appendChild(card);
    boardEl.appendChild(cell);
    cardData.el = card;
  });
}

function renderCard(idx){
  const c = state.cards[idx];
  const el = c.el;
  if(c.matched){
    el.className = 'card matched';
    el.innerHTML = `<img src="${ICONS[c.symbol]}" alt="">`;
  } else if(c.revealed){
    el.className = 'card revealed';
    el.innerHTML = `<img src="${ICONS[c.symbol]}" alt="">`;
  } else {
    el.className = 'card';
    el.innerHTML = '';
  }
}

function renderAll(){
  state.cards.forEach((_, idx)=> renderCard(idx));
}

function tryReveal(idx){
  if(state.busy) return;
  const c = state.cards[idx];
  if(!c || c.matched || c.revealed) return;

  if(!state.started){
    state.started = true;
    startTimer();
  }

  c.revealed = true;
  renderCard(idx);
  c.el.classList.add('pop');
  state.revealedIdx.push(idx);

  if(state.revealedIdx.length === 2){
    state.busy = true;
    state.moves++;
    movesVal.textContent = state.moves;

    const [i1, i2] = state.revealedIdx;
    const c1 = state.cards[i1], c2 = state.cards[i2];

    if(c1.symbol === c2.symbol){
      setTimeout(()=>{
        c1.matched = true; c2.matched = true;
        renderCard(i1); renderCard(i2);
        state.pairsFound++;
        pairsVal.textContent = state.pairsFound + '/10';
        state.revealedIdx = [];
        state.busy = false;
        if(state.pairsFound === SYMBOLS.length){
          finishGame();
        }
      }, 260);
    } else {
      c1.el.classList.add('wrong');
      c2.el.classList.add('wrong');
      setTimeout(()=>{
        c1.revealed = false; c2.revealed = false;
        renderCard(i1); renderCard(i2);
        state.revealedIdx = [];
        state.busy = false;
      }, 700);
    }
  }
}

function finishGame(){
  stopTimer();
  winText.textContent = `Tempo: ${formatTime(state.seconds)} · Jogadas: ${state.moves}`;
  setTimeout(()=>{ winOverlay.classList.add('show'); }, 300);
}

let lastTouchTime = 0;
function handleActivate(e){
  const card = e.target.closest('.card');
  if(!card) return;
  tryReveal(parseInt(card.dataset.idx,10));
}
boardEl.addEventListener('click', (e)=>{
  if(Date.now() - lastTouchTime < 500) return;
  handleActivate(e);
});
boardEl.addEventListener('touchend', (e)=>{
  lastTouchTime = Date.now();
  const touch = e.changedTouches && e.changedTouches[0];
  if(!touch) return;
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if(!el) return;
  const card = el.closest('.card');
  if(!card) return;
  e.preventDefault();
  tryReveal(parseInt(card.dataset.idx,10));
}, { passive:false });

function newGame(){
  stopTimer();
  state.moves = 0;
  state.seconds = 0;
  state.started = false;
  state.busy = false;
  state.pairsFound = 0;
  state.revealedIdx = [];
  movesVal.textContent = '0';
  timeVal.textContent = '00:00';
  pairsVal.textContent = '0/10';
  winOverlay.classList.remove('show');
  buildBoard();
  renderAll();
}

document.getElementById('shuffleBtn').addEventListener('click', newGame);
document.getElementById('playAgainBtn').addEventListener('click', newGame);

newGame();
</script>
